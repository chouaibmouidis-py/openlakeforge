duckdb_iceberg_lab:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: lab.duckdb
      threads: 1
    iceberg:
      type: duckdb
      path: iceberg_lab.duckdb
      database: iceberg_lab
      schema: duckdb_feasibility_lab
      threads: 1
      extensions: [httpfs, iceberg]
      secrets:
        - name: lab_s3
          type: s3
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          endpoint: localhost:18333
          url_style: path
          use_ssl: false
        - name: lab_polaris
          type: iceberg
          token: "{{ env_var('POLARIS_ACCESS_TOKEN') }}"
          endpoint: http://localhost:18181/api/catalog
      attach:
        - path: lakehouse_dev
          alias: polaris_catalog
          type: iceberg
          options:
            secret: lab_polaris
            endpoint: http://localhost:18181/api/catalog
            access_delegation_mode: none
