# Garage S3-compatible object storage — local kind / Docker Desktop cluster
# Chart: infra/helm/charts/garage  (vendored, based on dxflrs/amd64_garage)

image:
  repository: dxflrs/amd64_garage
  tag: "v1.3.1"
  pullPolicy: IfNotPresent

garage:
  rpcSecret: "abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"
  replicationFactor: 1
  dbEngine: "lmdb"
  s3Region: "us-east-1"
  adminToken: "local-dev-admin-token"

persistence:
  meta:
    size: 500Mi
    storageClass: standard
  data:
    size: 5Gi
    storageClass: standard

service:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
